<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>TriageDesk — IT-Support Ticket-Triage</title>
<style>
  :root{
    --bg:#0b1020; --bg2:#111a33; --card:#151f3d; --line:#24325c;
    --tx:#e8eefc; --tx2:#93a4c8; --tx3:#61729a;
    --ac:#38bdf8; --ac2:#818cf8;
    --p1:#ef4444; --p2:#f59e0b; --p3:#38bdf8; --p4:#64748b;
    --ok:#22c55e;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1b2a55 0%,var(--bg) 55%) no-repeat,var(--bg);
    color:var(--tx); min-height:100vh;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:0 0 40px;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}

  /* ---------- Header ---------- */
  header{padding:26px 0 18px;text-align:center}
  .logo{
    display:inline-flex;align-items:center;gap:10px;
    font-weight:700;font-size:1.35rem;letter-spacing:-.02em;
  }
  .logo .dot{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--ac),var(--ac2));
    display:grid;place-items:center;font-size:18px;
    box-shadow:0 6px 20px rgba(56,189,248,.35);
  }
  header p{margin:8px 0 0;color:var(--tx2);font-size:.9rem}

  /* ---------- Cards ---------- */
  .card{
    background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid var(--line); border-radius:var(--r);
    padding:18px; margin-bottom:16px;
  }
  label.lbl{display:block;font-size:.8rem;font-weight:600;color:var(--tx2);
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}

  textarea{
    width:100%;min-height:104px;resize:vertical;
    background:#0d1730;color:var(--tx);border:1px solid var(--line);
    border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;
  }
  textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
  textarea::placeholder{color:var(--tx3)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{
    background:#0d1730;border:1px solid var(--line);color:var(--tx2);
    padding:8px 12px;border-radius:999px;font-size:.8rem;cursor:pointer;
    transition:.15s;
  }
  .chip:active{transform:scale(.96);border-color:var(--ac);color:var(--tx)}

  .btn{
    width:100%;margin-top:14px;border:0;border-radius:12px;
    padding:15px;font:inherit;font-weight:700;font-size:1rem;color:#04101f;
    background:linear-gradient(135deg,var(--ac),var(--ac2));
    cursor:pointer;transition:.15s;
  }
  .btn:active{transform:scale(.985)}
  .btn.ghost{background:#0d1730;color:var(--tx2);border:1px solid var(--line);font-weight:600}
  .row{display:flex;gap:10px}
  .row .btn{margin-top:0}

  /* ---------- Ergebnis ---------- */
  #out{display:none}
  #out.show{display:block;animation:up .32s ease}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .verdict{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
  .prio{
    flex:none;width:58px;height:58px;border-radius:14px;
    display:grid;place-items:center;font-weight:800;font-size:1.05rem;color:#04101f;
  }
  .verdict h2{margin:0 0 3px;font-size:1.12rem;line-height:1.3}
  .verdict .sub{color:var(--tx2);font-size:.83rem}

  .meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  .pill{
    background:#0d1730;border:1px solid var(--line);border-radius:999px;
    padding:6px 11px;font-size:.76rem;color:var(--tx2)
  }
  .pill b{color:var(--tx);font-weight:600}

  h3.sec{
    font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;
    color:var(--tx3);margin:22px 0 10px;font-weight:700
  }

  ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
  ol.steps li{
    counter-increment:s;position:relative;padding:11px 0 11px 42px;
    border-bottom:1px solid rgba(36,50,92,.6);font-size:.94rem;
  }
  ol.steps li:last-child{border-bottom:0}
  ol.steps li::before{
    content:counter(s);position:absolute;left:0;top:10px;
    width:27px;height:27px;border-radius:8px;display:grid;place-items:center;
    background:#0d1730;border:1px solid var(--line);
    color:var(--ac);font-size:.8rem;font-weight:700
  }

  .signals{display:flex;flex-wrap:wrap;gap:6px}
  .sig{
    background:rgba(56,189,248,.09);border:1px solid rgba(56,189,248,.3);
    color:#9fd8f7;padding:4px 9px;border-radius:7px;font-size:.74rem;font-family:ui-monospace,Menlo,Consolas,monospace
  }

  pre.reply{
    background:#0d1730;border:1px solid var(--line);border-radius:12px;
    padding:14px;white-space:pre-wrap;word-wrap:break-word;
    font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#cfe0ff;margin:0;
  }

  .esc{
    background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);
    border-radius:12px;padding:12px 14px;font-size:.88rem;color:#ffc9c9
  }
  .esc b{color:#ff9b9b}

  .empty{text-align:center;color:var(--tx3);padding:34px 10px;font-size:.9rem}
  .empty .big{font-size:2.2rem;margin-bottom:10px;opacity:.5}

  footer{text-align:center;color:var(--tx3);font-size:.75rem;padding:14px 0 0;line-height:1.7}

  /* Toast beim Kopieren */
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);
    background:var(--ok);color:#04120a;font-weight:700;font-size:.85rem;
    padding:11px 20px;border-radius:999px;opacity:0;transition:.28s;pointer-events:none;
    box-shadow:0 8px 26px rgba(34,197,94,.4);z-index:99
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo"><span class="dot">⚡</span> TriageDesk</div>
    <p>Ticket-Triage für den IT-Support — Kategorie, Priorität, Lösung in Sekunden</p>
  </header>

  <div class="card">
    <label class="lbl" for="txt">Problem beschreiben</label>
    <textarea id="txt" placeholder="z. B. „Seit heute früh kann ich mich nicht mehr anmelden, mein Konto ist gesperrt und ich habe gleich einen Kundentermin."></textarea>

    <div class="chips" id="chips"></div>

    <div class="row" style="margin-top:14px">
      <button class="btn" id="go">Analysieren</button>
      <button class="btn ghost" id="clr" style="flex:0 0 96px">Leeren</button>
    </div>
  </div>

  <div class="card" id="out"></div>

  <footer>
    Regelbasierte Triage-Engine · läuft vollständig offline im Browser<br>
    Klassifizierung · Priorisierung · Lösungsschritte · Antwortentwurf · Eskalation
  </footer>
</div>

<div id="toast">Kopiert</div>

<script>
/* =====================================================================
   TriageDesk — regelbasierte Ticket-Triage-Engine
   Fachlogik: Kategorie-Erkennung (Keyword-Gewichtung) + Prioritätsregeln
   (ITIL-nah) + Lösungsdatenbank + Antwortvorlagen + Eskalationskriterien.
   ===================================================================== */

/* ---------- 1. Wissensbasis: Kategorien ---------- */
/* kw = Schlüsselwörter mit Gewicht; steps = Lösungsschritte;
   reply = Antwortvorlage; sla = Reaktionszeit; esc = Eskalationshinweis */
const KB = [
  {
    id:"net", name:"Netzwerk & Konnektivität", icon:"🌐", sla:"30 Min",
    kw:[["internet",3],["wlan",3],["wifi",3],["netzwerk",3],["netz",2],["vpn",3],
        ["verbindung",2],["offline",2],["kein zugriff auf",2],["langsam",1],["seite lädt",2],
        ["dns",3],["ip",2],["router",2],["lan",2],["timeout",2],["abgebrochen",1]],
    steps:[
      "Geltungsbereich klären: Nur ein Gerät, eine Abteilung oder alle? → bestimmt die Priorität.",
      "WLAN/LAN-Status am Gerät prüfen (Flugmodus aus, richtiges SSID, Kabel gesteckt).",
      "Anderes Gerät im selben Netz testen → unterscheidet Geräte- von Netzproblem.",
      "IP-Konfiguration prüfen: `ipconfig /release` und `ipconfig /renew`.",
      "DNS-Test: `nslookup intern.example.com` und `ping 8.8.8.8` (IP geht, Name nicht → DNS).",
      "Bei VPN: Tunnel-Status, Zertifikatsgültigkeit, Zugangsdaten und Portal-Erreichbarkeit prüfen.",
      "Switch/AP-Port am Patchfeld und Access-Point-Log prüfen, bevor eskaliert wird."
    ],
    reply:"Guten Tag,\n\nvielen Dank für die Meldung. Ich prüfe die Netzwerkverbindung Ihres Geräts.\n\nBitte testen Sie kurz: 1) Sind Sie im richtigen WLAN? 2) Tritt das Problem auch bei einer anderen Website auf? 3) Funktioniert ein anderes Gerät im selben Netz?\n\nDiese Angaben helfen mir, den Fehler schnell einzugrenzen. Ich melde mich umgehend mit dem Ergebnis.",
    esc:"Sofort an Netzwerk-Team, wenn mehrere Nutzer oder ein ganzer Standort betroffen sind, oder wenn der Ausfall geschäftskritische Systeme trifft."
  },
  {
    id:"prt", name:"Drucken & Scannen", icon:"🖨️", sla:"2 Std",
    kw:[["drucker",3],["druckt",3],["druck",2],["papierstau",3],["toner",3],["patrone",3],
        ["scanner",3],["scan",2],["fax",2],["kopier",2],["druckauftrag",3],["wird nicht gedruckt",3]],
    steps:[
      "Druckerstatus im System prüfen: online, bereit, keine Fehlermeldung am Display.",
      "Warteschlange kontrollieren und hängende Aufträge entfernen (Spooler leeren).",
      "Druckdienst neu starten: `net stop spooler` → `net stop spooler` (Dienst neu starten).",
      "Treiber und Anschluss (IP/USB/Netzwerk) prüfen, Testseite drucken.",
      "Bei Netzwerkdrucker: IP-Adresse erreichbar? `ping <drucker-ip>`, Verbrauchsmaterial prüfen.",
      "Scannen: Zielordner/SMB-Freigabe, Berechtigung und Scan-Profil kontrollieren."
    ],
    reply:"Guten Tag,\n\nich kümmere mich um das Druckproblem. Bitte senden Sie mir kurz die Druckerbezeichnung (steht meist oben am Gerät) und ob eine Fehlermeldung im Display erscheint.\n\nIn der Zwischenzeit können Sie am nächstgelegenen Drucker drucken. Ich prüfe Warteschlange und Treiber und melde mich mit der Lösung.",
    esc:"An 2nd Level, wenn der Druckserver selbst betroffen ist oder mehrere Abteilungen nicht drucken können."
  },
  {
    id:"acc", name:"Konto & Anmeldung", icon:"🔑", sla:"1 Std",
    kw:[["passwort",3],["anmeld",3],["login",3],["gesperrt",3],["konto",2],["benutzer",2],
        ["mfa",3],["2fa",3],["authentif",3],["token",2],["abgelaufen",2],["vergessen",3],
        ["anmelden",3],["sperre",2]],
    steps:[
      "Identität des Nutzers verifizieren (Rückruf auf hinterlegte Nummer oder Ticket-Freigabe) — Pflicht vor jeder Kontomaßnahme.",
      "Kontostatus im Verzeichnis prüfen: gesperrt, abgelaufen, Passwort abgelaufen?",
      "Konto entsperren und Passwort-Reset auslösen (Self-Service-Link bevorzugen).",
      "MFA-Faktoren prüfen: Gerät registriert, Token synchron, Backup-Codes vorhanden?",
      "Anmeldeversuche im Log prüfen — viele Fehlversuche können auf einen Angriff hindeuten.",
      "Testanmeldung durchführen und Nutzer bestätigen lassen."
    ],
    reply:"Guten Tag,\n\nich habe Ihr Konto entsperrt und einen Link zum Zurücksetzen des Passworts an Ihre hinterlegte Adresse gesendet.\n\nBitte setzen Sie das Passwort zurück und melden Sie sich neu an. Falls Sie die Zwei-Faktor-Abfrage nicht abschließen können, teilen Sie mir kurz mit, welches Gerät Sie nutzen — dann richte ich den Faktor neu ein.",
    esc:"Sofort an Security, wenn viele Fehlversuche von fremden IPs auftreten oder der Nutzer eine Anmeldung nicht erkennt."
  },
  {
    id:"mail", name:"E-Mail & Kommunikation", icon:"✉️", sla:"2 Std",
    kw:[["outlook",3],["e-mail",3],["email",3],["mail",2],["postfach",3],["kalender",3],
        ["teams",3],["besprechung",2],["einladung",2],["senden",2],["empfangen",2],["posteingang",3]],
    steps:[
      "Eingrenzen: Senden, Empfangen oder beides betroffen? Betrifft es nur einen Ordner?",
      "Postfachgröße prüfen — volles Postfach blockiert den Empfang.",
      "Verbindungsstatus des Clients und Anmeldedaten im Profil kontrollieren.",
      "Outlook neu starten, im abgesicherten Modus testen (Add-ins als Ursache ausschließen).",
      "Web-Mail testen → unterscheidet Client- von Serverproblem.",
      "Bei Kalender/Teams: Lizenz, Freigabe und Synchronisationsstatus prüfen."
    ],
    reply:"Guten Tag,\n\nvielen Dank für Ihre Nachricht. Damit ich das E-Mail-Problem schnell lösen kann: Können Sie Nachrichten senden, empfangen, oder beides nicht? Tritt es in Outlook und im Web-Mail auf?\n\nIch prüfe parallel Postfachgröße und Serverseite und melde mich umgehend.",
    esc:"An Messaging-Team, wenn der Mailserver betroffen ist oder Zustellungen verzögert/verloren gehen."
  },
  {
    id:"hw", name:"Hardware & Geräte", icon:"💻", sla:"4 Std",
    kw:[["laptop",3],["notebook",3],["monitor",3],["bildschirm",3],["tastatur",3],
        ["maus",3],["akku",3],["netzteil",3],["startet nicht",3],["geht nicht an",3],
        ["defekt",3],["kabel",2],["dock",3],["docking",3],["überhitzt",3],["laut",2]],
    steps:[
      "Fehlerbild präzise aufnehmen: Was passiert genau, seit wann, gab es ein Ereignis (Sturz, Update)?",
      "Stromversorgung prüfen: Netzteil, Kabel, Ladestatus, andere Steckdose.",
      "Externe Geräte abstecken und Neustart versuchen (Minimalkonfiguration).",
      "Beim Docking: anderen Port/Kabel testen, Firmware des Docks prüfen.",
      "Hardware-Diagnose starten (Hersteller-Tool oder BIOS-Diagnose).",
      "Ersatzgerät prüfen und bei Bedarf bereitstellen, defektes Gerät für Garantie/Austausch erfassen."
    ],
    reply:"Guten Tag,\n\nich habe Ihre Meldung aufgenommen. Damit wir den Ausfall schnell beheben: Können Sie mir sagen, ob das Gerät noch startet und ob eine Fehlermeldung erscheint?\n\nFalls das Gerät nicht nutzbar ist, stelle ich Ihnen kurzfristig ein Ersatzgerät bereit. Bitte nennen Sie mir Ihren Standort.",
    esc:"An Hardware-Service, wenn ein Garantiefall oder Datenträgerausfall vorliegt (Datenrettung nötig)."
  },
  {
    id:"sw", name:"Software & Anwendungen", icon:"🧩", sla:"4 Std",
    kw:[["programm",3],["software",3],["anwendung",3],["app",2],["installier",3],["update",2],
        ["absturz",3],["stürzt ab",3],["fehlermeldung",2],["lizenz",3],["excel",3],["word",3],
        ["sap",3],["öffnet nicht",3],["reagiert nicht",3],["hängt",2]],
    steps:[
      "Fehlermeldung wörtlich erfassen — sie bestimmt die Lösung (Screenshot anfordern).",
      "Reproduzierbar? Tritt es bei anderen Nutzern oder nur hier auf?",
      "Anwendung neu starten, danach Gerät neu starten.",
      "Lizenz- und Berechtigungsstatus im Lizenzportal prüfen.",
      "Programm reparieren oder neu installieren (Softwareverteilung nutzen).",
      "Logs der Anwendung prüfen und Fehlercode dokumentieren.",
      "Bei Updates: Version prüfen, ggf. auf vorherige Version zurückrollen."
    ],
    reply:"Guten Tag,\n\nbitte senden Sie mir einen Screenshot der Fehlermeldung — damit kann ich die Ursache meist direkt bestimmen.\n\nIch prüfe parallel Ihren Lizenz- und Installationsstatus und melde mich mit der Lösung. Falls die Anwendung für Ihre Arbeit dringend benötigt wird, nennen Sie mir bitte die Frist.",
    esc:"An Anwendungsbetreuung/Hersteller, wenn ein Produktfehler, Datenbankfehler oder ein Fehler in einer Fachanwendung vorliegt."
  },
  {
    id:"perm", name:"Zugriff & Berechtigungen", icon:"🔒", sla:"4 Std",
    kw:[["berechtigung",3],["zugriff",3],["freigabe",3],["laufwerk",3],["ordner",3],
        ["netzlaufwerk",3],["rechte",3],["gesperrt für",2],["darf nicht",2],["kein zugriff",3],
        ["sharepoint",3],["team-ordner",2]],
    steps:[
      "Anforderung klären: Welche Ressource, welche Rechte, welche Begründung?",
      "Berechtigungskonzept prüfen — Genehmigung des Fachbereichs einholen (Vier-Augen-Prinzip).",
      "Gruppenmitgliedschaft prüfen (Rechte kommen über Gruppen, nicht direkt).",
      "Zuordnung zur richtigen Rolle/Gruppe vornehmen, Änderung dokumentieren.",
      "Nutzer neu anmelden lassen (Gruppenrechte greifen oft erst nach Neuanmeldung).",
      "Zugriff testen und Bestätigung einholen."
    ],
    reply:"Guten Tag,\n\nfür die Freigabe benötige ich noch die schriftliche Genehmigung Ihres Fachbereichs. Sobald diese vorliegt, richte ich den Zugriff ein und bestätige Ihnen die Freischaltung.\n\nBitte melden Sie sich nach der Freigabe einmal neu an, damit die Berechtigung aktiv wird.",
    esc:"An IT-Security, wenn es um erhöhte Rechte, Administratorenzugänge oder kritische Daten geht."
  },
  {
    id:"sec", name:"Sicherheit & Vorfälle", icon:"🛡️", sla:"15 Min",
    kw:[["phishing",4],["virus",3],["malware",3],["ransomware",4],["verschlüsselt",3],["verdacht",3],
        ["trojaner",3],["verdächtig",3],["spam",2],["betrug",3],["gehackt",3],
        ["datenverlust",3],["angriff",3],["fremde anmeldung",3],["erpressung",3]],
    steps:[
      "SOFORT: Gerät vom Netz trennen (WLAN aus, Kabel ziehen) — Ausbreitung verhindern.",
      "Nichts löschen, nichts neu starten, keine Dateien öffnen — Beweise sichern.",
      "Vorfall an IT-Security melden (Incident-Hotline) — höchste Priorität, keine Eigenreparatur.",
      "Betroffene Konten sperren und Passwörter aller genutzten Konten ändern lassen.",
      "Bei verdächtiger Mail: Absender und Header sichern, Mail nicht weiterleiten, melden.",
      "Vorfall dokumentieren: Zeitpunkt, Beobachtung, betroffene Systeme, bereits getroffene Maßnahmen.",
      "Nach Freigabe durch Security: Neuinstallation/Aufräumen, Nutzer informieren."
    ],
    reply:"WICHTIG: Bitte trennen Sie das Gerät sofort vom Netzwerk (WLAN aus, Netzwerkkabel ziehen) und öffnen Sie keine Dateien mehr.\n\nLöschen Sie nichts und starten Sie das Gerät nicht neu — wir müssen den Vorfall untersuchen. Ich habe den Sicherheitsvorfall gemeldet; unser Security-Team übernimmt und kontaktiert Sie umgehend.\n\nVielen Dank für die schnelle Meldung — genau richtig gehandelt.",
    esc:"IMMER sofort an IT-Security — niemals selbst reparieren. Bei Ransomware zusätzlich Geschäftsführung und Datenschutzbeauftragten informieren."
  },
  {
    id:"tel", name:"Telefonie & Mobilität", icon:"📞", sla:"2 Std",
    kw:[["telefon",3],["anruf",3],["festnetz",3],["handy",3],["mobiltelefon",3],
        ["headset",4],["mikrofon",4],["kamera",2],["rufnummer",2],["voip",3],["softphone",3],
        ["kein ton",4],["ton",2],["audio",3],["lautsprecher",3]],
    steps:[
      "Eingrenzen: Nur ein Gerät oder die Anlage? Eingehend, ausgehend oder beides?",
      "Gerät prüfen: Strom, Netzwerk, Headset korrekt angeschlossen und ausgewählt.",
      "Mikrofon-/Kamerafreigabe im Betriebssystem und in der Anwendung kontrollieren.",
      "Bei VoIP: Registrierungsstatus der Nebenstelle und Netzwerkgüte prüfen.",
      "Testanruf durchführen, ggf. Nebenstelle neu registrieren.",
      "Bei Mobilgeräten: SIM/Aktivierung, Profil, Gerätesperre und Rufumleitung prüfen."
    ],
    reply:"Guten Tag,\n\nich prüfe die Telefonie für Sie. Bitte testen Sie kurz: Können Sie angerufen werden, und klappt das Wählen? Ist Ihr Headset korrekt ausgewählt?\n\nFalls die Störung die gesamte Anlage betrifft, melde ich sie direkt beim Anbieter und halte Sie auf dem Laufenden.",
    esc:"An Telefonie-Anbieter/2nd Level, wenn die TK-Anlage oder mehrere Nebenstellen betroffen sind."
  },
  {
    id:"dat", name:"Daten, Dateien & Backup", icon:"💾", sla:"2 Std",
    kw:[["datei",2],["gelöscht",3],["verloren",3],["backup",3],["sicherung",3],
        ["wiederherstell",3],["wiederherstellen",3],["papierkorb",3],["version",2],
        ["wiederherstellung",3],["datum",1],["speichern",2],["dokument weg",3]],
    steps:[
      "Ruhe bewahren, sofort nichts mehr auf dem Datenträger speichern (Überschreibungsgefahr).",
      "Lokalen Papierkorb und „Gelöschte Elemente“ prüfen.",
      "Version-Verlauf (SharePoint/OneDrive/Netzlaufwerk-Snapshots) prüfen.",
      "Backup-Katalog prüfen: letzte Sicherung, Aufbewahrungszeit, betroffener Pfad.",
      "Wiederherstellung durchführen und Nutzer das Ergebnis bestätigen lassen.",
      "Datenverlust-Ursache klären und Maßnahme dokumentieren (Sicherungsstrategie anpassen)."
    ],
    reply:"Guten Tag,\n\nbitte speichern Sie ab jetzt nichts mehr auf diesem Gerät bzw. Laufwerk — das erhöht die Chance der Wiederherstellung.\n\nIch prüfe Papierkorb, Versionsverlauf und die letzte Sicherung und melde mich mit dem Ergebnis. Bitte nennen Sie mir den Dateinamen und den ungefähren Zeitpunkt der letzten Änderung.",
    esc:"An Backup-Team, wenn die Sicherung eingespielt werden muss oder Daten aus einer Sicherung fehlen."
  }
];

/* ---------- 2. Prioritätsregeln ---------- */
/* Höhere Gewichte schlagen niedrigere. Erste passende Stufe gewinnt. */
const PRIO_RULES = [
  { p:1, label:"Kritisch", adj:"Kritische", sla:"15 Min", color:"--p1",
    kw:["ransomware","verschlüsselt","erpressung","datenverlust","ausfall","server down",
        "alle können nicht","keiner kann","niemand kann","komplettausfall","produktion steht",
        "gehackt","angriff","virus","malware","trojaner","notfall","kritisch",
        "phishing","verdacht","verdächtig","geklickt","mehrere","abteilung",
        "standort","betroffen","auch bei","bei kollegen","nichts geht"],
    why:"Ausfall- oder Sicherheitssignal: betrifft mehrere Nutzer, kritische Systeme oder die Datensicherheit." },
  { p:2, label:"Hoch", adj:"Hohe", sla:"1 Std", color:"--p2",
    kw:["geschäftsführung","vorstand","chef","leitung","kunde","kundentermin","termin",
        "präsentation","meeting","deadline","dringend","sofort","heute noch","frist",
        "abteilung steht","messe","vertrag"],
    why:"Geschäftskritischer Kontext: Führungskraft, Kunde, Termin oder Frist betroffen." },
  { p:3, label:"Mittel", adj:"Mittlere", sla:"4 Std", color:"--p3",
    kw:[], why:"Standardfall: einzelner Nutzer, Arbeit eingeschränkt, aber ein Ausweichweg existiert." },
  { p:4, label:"Niedrig", adj:"Niedrige", sla:"2 Tage", color:"--p4",
    kw:["wenn zeit","irgendwann","bei gelegenheit","kein stress","nice to have","optional",
        "kosmetisch","schön wäre","nicht dringend","unwichtig","ohne eile","keine eile",
        "eilt nicht","keine eile","wenn du mal"],
    why:"Keine Beeinträchtigung der Arbeit: Wunsch oder kosmetisches Thema ohne Zeitdruck." }
];

/* ---------- 3. Engine ---------- */
const norm = s => s.toLowerCase()
  .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");

/* Treffer-Erkennung: kurze Schlüsselwörter (<=4 Zeichen) nur als eigenes Wort,
   damit z. B. "lan" nicht in "langsam" trifft. Längere als Teilstring,
   damit Komposita wie "Netzwerkproblem" erkannt werden. */
function hit(text, kw){
  const k = norm(kw);
  if (k.length > 4) return text.includes(k);
  const esc = k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return new RegExp("(^|[^a-z0-9])" + esc + "([^a-z0-9]|$)").test(text);
}

/* Negation: Steht unmittelbar vor einem Signalwort eine Verneinung, darf es
   NICHT als Prioritaets-Ausloeser zaehlen — "keinen Termin" ist kein Termin-
   druck, "nicht dringend" ist keine hohe Prioritaet.
   Bewusst NICHT auf die Kategorie-Erkennung angewendet: "ich kann mich nicht
   anmelden" beschreibt ein Anmelde-Problem, die Verneinung gehoert dort zum
   Symptom. */
const NEG = ["kein","keine","keinen","keiner","keinem","keines","ohne","nicht",
             "nie","niemals","kaum","weder","entgegen"];
function negated(text, kw){
  const k = norm(kw);
  let i = text.indexOf(k);
  while (i !== -1){
    /* Nur innerhalb desselben Satzes pruefen: sonst wuerde das "nicht" aus
       "Seiten laden nicht. Kollegen sind betroffen." die Kollegen verneinen. */
    const seg = text.slice(0, i);
    const cut = Math.max(seg.lastIndexOf("."), seg.lastIndexOf("!"),
                         seg.lastIndexOf("?"), seg.lastIndexOf(";"),
                         seg.lastIndexOf(","));
    const before = text.slice(cut + 1, i).trim().split(/\s+/).filter(Boolean).slice(-2);
    const verneint = before.some(w => NEG.includes(w.replace(/[^a-z]/g, "")));
    if (!verneint) return false;      // mindestens ein unverneintes Vorkommen
    i = text.indexOf(k, i + 1);
  }
  return true;                        // nur verneinte Vorkommen gefunden
}

function scoreCategories(text){
  const t = norm(text);
  return KB.map(cat => {
    let score = 0; const hits = [];
    for (const [kw, w] of cat.kw){
      if (hit(t, kw)){ score += w; hits.push(kw); }
    }
    return { cat, score, hits };
  }).sort((a,b) => b.score - a.score);
}

function pickPriority(text){
  const t = norm(text);
  for (const r of PRIO_RULES){
    const hits = r.kw.filter(k => hit(t, k) && !negated(t, k));
    if (hits.length) return { ...r, hits };
  }
  return { ...PRIO_RULES[2], hits: [] };   // Default: Mittel
}

function analyze(text){
  const ranked = scoreCategories(text);
  const best = ranked[0];
  const second = ranked[1];
  const prio = pickPriority(text);

  // Konfidenz: Abstand zum Zweitplatzierten + absolute Trefferstärke
  let conf = 40;
  if (best.score > 0){
    const gap = best.score - (second ? second.score : 0);
    conf = Math.min(97, 52 + best.score * 5 + gap * 9);
  }
  // Konfidenz sinkt ohne Prioritätssignal (Standardfall ist unsicherer)
  if (prio.hits.length === 0) conf = Math.max(35, conf - 12);

  return { cat: best.cat, score: best.score, hits: best.hits,
           alternates: ranked.slice(1,3).filter(r => r.score > 0),
           prio, conf, chars: text.trim().length,
           /* ITIL-nah: Stoerung = Incident, Anforderung = Service Request */
           type: (best.cat.id === "perm" || prio.p === 4) ? "Service Request" : "Incident" };
}

/* ---------- 4. Beispiele ---------- */
const EXAMPLES = [
  ["Konto gesperrt", "Ich kann mich nicht anmelden, mein Konto ist gesperrt und ich habe in 30 Minuten einen Kundentermin."],
  ["Drucker streikt", "Der Drucker in Raum 204 druckt nicht, der Auftrag hängt in der Warteschlange und es blinkt eine rote Lampe."],
  ["Phishing-Mail", "Ich habe eine verdächtige Mail bekommen und versehentlich auf den Link geklickt. Jetzt ist der Rechner sehr langsam."],
  ["Netzwerk", "Seit heute früh habe ich kein Internet, WLAN wird angezeigt aber Seiten laden nicht. Kollegen am selben Switch sind auch betroffen."],
  ["Datei gelöscht", "Ich habe aus Versehen eine wichtige Excel-Datei gelöscht, sie ist auch nicht im Papierkorb."],
  ["Software-Fehler", "SAP öffnet nicht mehr, es kommt eine Fehlermeldung und das Programm stürzt direkt ab."],
  ["Zugriff", "Ich brauche Zugriff auf den Team-Ordner im Netzlaufwerk, meine Kollegin hat ihn auch."],
  ["Kleinigkeit", "Mein Monitorkabel ist etwas locker, aber es funktioniert – kein Stress, wenn du mal Zeit hast."]
];

/* ---------- 5. Rendern ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(r){
  const color = getComputedStyle(document.documentElement).getPropertyValue(r.prio.color).trim();
  const alt = r.alternates.length
    ? r.alternates.map(a => `${a.cat.icon} ${a.cat.name} (${a.score})`).join(" · ")
    : "keine";

  $("out").innerHTML = `
    <div class="verdict">
      <div class="prio" style="background:${color}">P${r.prio.p}</div>
      <div>
        <h2>${r.cat.icon} ${esc(r.cat.name)}</h2>
        <div class="sub">${esc(r.prio.adj)} Priorität · ${r.type}</div>
      </div>
    </div>

    <div class="meta">
      <span class="pill">SLA <b>${esc(r.prio.sla)}</b></span>
      <span class="pill">Konfidenz <b>${r.conf}%</b></span>
      <span class="pill">Treffer <b>${r.score}</b></span>
      <span class="pill">Umfang <b>${r.chars} Zeichen</b></span>
    </div>

    <h3 class="sec">Warum diese Priorität</h3>
    <div class="esc" style="background:rgba(56,189,248,.07);border-color:rgba(56,189,248,.28);color:#bcd9f2">
      ${esc(r.prio.why)}
      ${r.prio.hits.length ? `<br><br><b>Auslöser:</b> ${r.prio.hits.map(h=>`<span class="sig">${esc(h)}</span>`).join(" ")}` : ""}
    </div>

    <h3 class="sec">Erkannte Signale</h3>
    <div class="signals">
      ${r.hits.length ? r.hits.map(h=>`<span class="sig">${esc(h)}</span>`).join("") : `<span class="sig">keine</span>`}
    </div>

    <h3 class="sec">Lösungsschritte</h3>
    <ol class="steps">${r.cat.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>

    <h3 class="sec">Antwortentwurf</h3>
    <pre class="reply" id="reply">${esc(r.cat.reply)}</pre>
    <button class="btn ghost" id="copy" style="margin-top:10px">Antwort kopieren</button>

    <h3 class="sec">Eskalation</h3>
    <div class="esc">${esc(r.cat.esc)}</div>

    <h3 class="sec">Alternative Kategorien</h3>
    <div class="signals">${r.alternates.length
      ? r.alternates.map(a=>`<span class="sig">${a.cat.icon} ${esc(a.cat.name)} · ${a.score}</span>`).join("")
      : `<span class="sig">eindeutig</span>`}</div>
  `;
  $("out").classList.add("show");

  const cp = $("copy");
  if (cp) cp.onclick = () => {
    const txt = $("reply").textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(()=>toast("Antwort kopiert"))
      .catch(()=>{
        const ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); toast("Antwort kopiert"); }catch(e){ toast("Bitte manuell markieren"); }
        ta.remove();
      });
  };
}

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1600);
}

/* ---------- 6. Verdrahtung ---------- */
$("chips").innerHTML = EXAMPLES.map(([label], i) =>
  `<span class="chip" data-i="${i}">${esc(label)}</span>`).join("");

$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  $("txt").value = EXAMPLES[+c.dataset.i][1];
  run();
});

function run(){
  const txt = $("txt").value.trim();
  if (txt.length < 8){
    $("out").innerHTML = `<div class="empty"><div class="big">✍️</div>Bitte beschreiben Sie das Problem — mindestens ein kurzer Satz.</div>`;
    $("out").classList.add("show");
    return;
  }
  render(analyze(txt));
  const el = $("out");
  if (el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"nearest"});
}

$("go").onclick = run;
$("clr").onclick = () => { $("txt").value = ""; $("out").classList.remove("show"); $("txt").focus(); };
$("txt").addEventListener("keydown", e => { if (e.key==="Enter" && (e.ctrlKey||e.metaKey)) run(); });
</script>
</body>
